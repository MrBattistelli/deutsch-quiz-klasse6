<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammatik-Quiz Klasse 6</title>
<style>
  :root{
    --ink:#131a2e;
    --ink-2:#1c2542;
    --paper:#f6f2e8;
    --muted:#9aa4c2;
    --coral:#e2523f;
    --amber:#eda21c;
    --teal:#0f9b8a;
    --violet:#6f57d8;
    --good:#2fbf71;
    --line:rgba(246,242,232,.14);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    background:
      radial-gradient(1200px 600px at 50% -10%, #222c4e 0%, transparent 60%),
      var(--ink);
    color:var(--paper);
    font-family:"Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display:flex; align-items:flex-start; justify-content:center;
    padding:24px;
    min-height:100%;
  }
  .wrap{width:min(1100px,100%)}
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
    border:1px solid var(--line);
    border-radius:22px;
    padding:clamp(20px,3vw,38px);
  }
  h1{
    font-size:clamp(28px,5vw,52px);
    line-height:1.05; margin:0 0 6px;
    letter-spacing:-.02em;
  }
  h1 span{color:var(--amber)}
  .lead{color:var(--muted); margin:0 0 26px; font-size:clamp(14px,1.6vw,17px)}
  .label{
    text-transform:uppercase; letter-spacing:.16em; font-size:12px;
    color:var(--muted); margin:22px 0 10px; font-weight:700;
  }
  .chips{display:flex; flex-wrap:wrap; gap:10px}
  .chip{
    border:1px solid var(--line); background:rgba(255,255,255,.04);
    color:var(--paper); border-radius:999px; padding:11px 18px;
    font-size:15px; font-weight:600; cursor:pointer; transition:.15s;
  }
  .chip:hover{background:rgba(255,255,255,.1)}
  .chip.on{background:var(--paper); color:var(--ink); border-color:var(--paper)}
  .chip small{display:block; font-weight:500; opacity:.6; font-size:11px}
  .row{display:flex; flex-wrap:wrap; gap:26px; align-items:center; margin-top:8px}
  .switch{display:flex; align-items:center; gap:9px; font-size:15px; cursor:pointer; user-select:none}
  .switch input{width:18px; height:18px; accent-color:var(--amber); cursor:pointer}
  .btn{
    margin-top:28px; border:0; border-radius:14px; cursor:pointer;
    background:var(--amber); color:#1a1405;
    font-size:19px; font-weight:800; padding:16px 34px;
    transition:.15s;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn.ghost{background:transparent; color:var(--paper); border:1px solid var(--line); font-weight:600}
  .btn:disabled{opacity:.35; cursor:not-allowed; transform:none}
  .hint{color:var(--muted); font-size:13px; margin-top:16px}

  /* Quiz */
  .top{display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:14px; font-size:14px; color:var(--muted)}
  .top b{color:var(--paper)}
  .bar{height:10px; background:rgba(255,255,255,.08); border-radius:99px; overflow:hidden}
  .bar>i{display:block; height:100%; width:100%; background:var(--amber); transition:width .1s linear}
  .bar.warn>i{background:var(--coral)}
  .question{
    font-size:clamp(22px,3.6vw,40px); font-weight:800; line-height:1.22;
    margin:clamp(24px,4vw,44px) 0; text-align:center; letter-spacing:-.01em;
  }
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .tile{
    display:flex; align-items:center; gap:14px; text-align:left;
    border:0; border-radius:16px; cursor:pointer; color:#fff;
    padding:20px 22px; font-size:clamp(16px,2vw,22px); font-weight:700;
    font-family:inherit; min-height:96px; transition:.15s;
  }
  .tile:hover{filter:brightness(1.12)}
  .tile .k{
    flex:0 0 34px; height:34px; border-radius:9px;
    background:rgba(0,0,0,.22); display:grid; place-items:center;
    font-size:15px; font-weight:800;
  }
  .t0{background:var(--coral)} .t1{background:var(--amber); color:#1a1405}
  .t2{background:var(--teal)} .t3{background:var(--violet)}
  .tile.dim{opacity:.28}
  .tile.right{outline:4px solid var(--good); outline-offset:3px; opacity:1}
  .tile.wrong{outline:4px solid #fff; outline-offset:3px; opacity:1}
  .verdict{margin-top:22px; text-align:center; font-size:clamp(18px,2.4vw,26px); font-weight:800; min-height:34px}
  .verdict.ok{color:var(--good)} .verdict.no{color:var(--coral)}

  /* Ende */
  .score{font-size:clamp(44px,9vw,96px); font-weight:900; letter-spacing:-.03em; line-height:1}
  table{width:100%; border-collapse:collapse; margin-top:22px; font-size:15px}
  th,td{text-align:left; padding:11px 8px; border-bottom:1px solid var(--line)}
  th{color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.1em; font-size:11px}
  td:last-child, th:last-child{text-align:right}
  .hidden{display:none}
  @media (max-width:720px){
    body{padding:12px}
    .card{border-radius:16px}
    .grid{grid-template-columns:1fr}
    .tile{min-height:64px; padding:16px}
    .top{font-size:12px; flex-wrap:wrap; gap:8px}
    .kbd{display:none}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="wrap">

  <noscript>
    <div class="card" style="margin-bottom:16px; border-color:#e2523f">
      <b>Das Quiz läuft hier nicht.</b><br>
      Diese Datei braucht einen echten Browser. Auf Handy oder Tablet die Datei nicht in der
      Dateivorschau öffnen, sondern über „Öffnen in“ an Chrome oder Safari weitergeben.
    </div>
  </noscript>

  <!-- START -->
  <section id="start" class="card">
    <h1>Grammatik-Quiz <span>Klasse 6</span></h1>
    <p class="lead">Wortarten, Zeitformen, Pronomen, Modalverben und Passiv, die vier Fälle. Auswählen, starten, mitspielen.</p>

    <div class="label">Themenblöcke</div>
    <div class="chips" id="blocks"></div>

    <div class="label">Einstellungen</div>
    <div class="row">
      <label class="switch"><input type="checkbox" id="optTimer" checked> Timer an</label>
      <label class="switch"><input type="checkbox" id="optShuffleQ" checked> Fragen mischen</label>
      <label class="switch"><input type="checkbox" id="optShuffleA" checked> Antworten mischen</label>
      <label class="switch"><input type="checkbox" id="optLimit"> Kurzrunde mit 15 Fragen</label>
    </div>

    <button class="btn" id="go">Quiz starten</button>
    <p class="hint kbd">Tastatur: 1 bis 4 zum Antworten, Leertaste für weiter. Vollbild mit F11.</p>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="card hidden">
    <div class="top">
      <div id="topic">Wortarten</div>
      <div>Frage <b id="qnum">1</b> von <b id="qtotal">20</b></div>
      <div>Punkte <b id="points">0</b></div>
    </div>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="question" id="qtext"></div>
    <div class="grid" id="answers"></div>
    <div class="verdict" id="verdict"></div>
    <div style="text-align:center">
      <button class="btn hidden" id="next">Weiter</button>
    </div>
  </section>

  <!-- ENDE -->
  <section id="end" class="card hidden">
    <div class="label">Ergebnis</div>
    <div class="score"><span id="finalPct">0</span>%</div>
    <p class="lead" id="finalLine"></p>
    <table>
      <thead><tr><th>Block</th><th>Richtig</th></tr></thead>
      <tbody id="breakdown"></tbody>
    </table>
    <button class="btn" id="again">Noch einmal</button>
    <button class="btn ghost" id="back">Andere Blöcke wählen</button>
  </section>

</div>

const $ = s => document.querySelector(s);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

let picked = new Set(DATA.map((_,i)=>i));
let queue = [], idx = 0, points = 0, correct = 0, stats = {};
let timerId = null, left = 0, span = 0, locked = false;

// Startbildschirm
const blocksEl = $("#blocks");
DATA.forEach((b,i)=>{
  const c = document.createElement("button");
  c.className = "chip on";
  c.innerHTML = b.t + "<small>" + b.q.length + " Fragen</small>";
  c.onclick = ()=>{
    if(picked.has(i)) picked.delete(i); else picked.add(i);
    c.classList.toggle("on", picked.has(i));
    $("#go").disabled = picked.size === 0;
  };
  blocksEl.appendChild(c);
});

$("#go").onclick = start;
$("#again").onclick = start;
$("#back").onclick = ()=>{ $("#end").classList.add("hidden"); $("#start").classList.remove("hidden"); };
$("#next").onclick = nextQuestion;

function start(){
  queue = [];
  stats = {};
  [...picked].sort().forEach(i=>{
    stats[DATA[i].t] = {ok:0, n:0};
    DATA[i].q.forEach(q=> queue.push({topic:DATA[i].t, text:q[0], answers:q[1], right:q[2], time:q[3]}));
  });
  if($("#optShuffleQ").checked) shuffle(queue);
  if($("#optLimit").checked) queue = queue.slice(0,15);
  queue.forEach(q=> stats[q.topic].n++);
  idx = 0; points = 0; correct = 0;
  $("#qtotal").textContent = queue.length;
  $("#start").classList.add("hidden");
  $("#end").classList.add("hidden");
  $("#quiz").classList.remove("hidden");
  render();
}

function render(){
  const q = queue[idx];
  locked = false;
  $("#topic").textContent = q.topic;
  $("#qnum").textContent = idx+1;
  $("#points").textContent = points;
  $("#qtext").textContent = q.text;
  $("#verdict").textContent = "";
  $("#verdict").className = "verdict";
  $("#next").classList.add("hidden");

  let order = q.answers.map((a,i)=>({a, i}));
  if($("#optShuffleA").checked) shuffle(order);
  const box = $("#answers");
  box.innerHTML = "";
  order.forEach((o, pos)=>{
    const b = document.createElement("button");
    b.className = "tile t"+pos;
    b.innerHTML = '<span class="k">'+(pos+1)+'</span><span>'+o.a+'</span>';
    b.onclick = ()=> answer(o.i === q.right, b);
    box.appendChild(b);
  });

  const bar = $("#bar");
  if($("#optTimer").checked){
    bar.style.visibility = "visible";
    span = q.time; left = q.time;
    bar.classList.remove("warn");
    $("#barFill").style.width = "100%";
    clearInterval(timerId);
    timerId = setInterval(tick, 100);
  } else {
    bar.style.visibility = "hidden";
    clearInterval(timerId);
  }
}

function tick(){
  left -= 0.1;
  $("#barFill").style.width = Math.max(0, left/span*100) + "%";
  if(left <= span*0.25) $("#bar").classList.add("warn");
  if(left <= 0){ clearInterval(timerId); answer(false, null, true); }
}

function answer(isRight, btn, timeout){
  if(locked) return;
  locked = true;
  clearInterval(timerId);
  const q = queue[idx];
  const tiles = [...document.querySelectorAll(".tile")];
  tiles.forEach(t=> t.classList.add("dim"));
  const rightText = q.answers[q.right];
  tiles.forEach(t=>{ if(t.textContent.slice(1) === rightText) t.classList.replace("dim","right"); });
  if(btn && !isRight) btn.classList.replace("dim","wrong");

  const v = $("#verdict");
  if(isRight){
    const gained = $("#optTimer").checked ? Math.round(500 + 500*(left/span)) : 700;
    points += gained; correct++; stats[q.topic].ok++;
    v.textContent = "Richtig, plus " + gained + " Punkte";
    v.className = "verdict ok";
  } else {
    v.textContent = timeout ? "Zeit abgelaufen. Richtig ist: " + rightText
                            : "Nicht ganz. Richtig ist: " + rightText;
    v.className = "verdict no";
  }
  $("#points").textContent = points;
  $("#next").textContent = idx+1 < queue.length ? "Weiter" : "Ergebnis anzeigen";
  $("#next").classList.remove("hidden");
}

function nextQuestion(){
  idx++;
  if(idx < queue.length) render(); else finish();
}

function finish(){
  clearInterval(timerId);
  $("#quiz").classList.add("hidden");
  $("#end").classList.remove("hidden");
  const pct = Math.round(correct/queue.length*100);
  $("#finalPct").textContent = pct;
  $("#finalLine").textContent = correct + " von " + queue.length + " Fragen richtig, " + points + " Punkte.";
  const tb = $("#breakdown");
  tb.innerHTML = "";
  Object.entries(stats).forEach(([name, s])=>{
    if(!s.n) return;
    const tr = document.createElement("tr");
    tr.innerHTML = "<td>"+name+"</td><td>"+s.ok+" von "+s.n+"</td>";
    tb.appendChild(tr);
  });
}

document.addEventListener("keydown", e=>{
  if($("#quiz").classList.contains("hidden")) return;
  if(["1","2","3","4"].includes(e.key)){
    const t = document.querySelectorAll(".tile")[+e.key-1];
    if(t) t.click();
  }
  if(e.key === " " || e.key === "Enter"){
    e.preventDefault();
    if(!$("#next").classList.contains("hidden")) nextQuestion();
  }
});
</script>
